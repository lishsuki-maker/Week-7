on: 
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      action:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform_deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}  
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::650694420923:role/Containerized_REST_API-OIDC-Role
          aws-region: ap-southeast-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: |
          terraform plan -var="image_tag=${{ inputs.image_tag }}" | tee terraform_plan_output.txt
      
      - name: Post Terraform Plan as a PR comment
        if: inputs.action == 'plan'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: terraform/envs/${{ inputs.env }}/terraform_plan_output.txt
          edit-mode: replace

      - name: Create ECR Repository
        if: inputs.action == 'create_ecr_repository'
        run: |
          terraform apply \
            -target="module.feedback_tracker.aws_ecr_repository.feedback_tracker" \
            -var="image_tag=${{ inputs.image_tag }}" \
            -auto-approve

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply \
            -var="image_tag=${{ inputs.image_tag }}" \
            -auto-approve
